# ============================================================================
# BI 低代码平台 - docker-compose 编排
# ============================================================================
# 一键启动: MySQL + Redis + 后端 + 前端
# 使用: docker compose up -d --build
# 生产环境请通过环境变量覆盖下列默认值（尤其是密码与密钥）
# ============================================================================

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: bi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: bi_lowcode
      TZ: Asia/Shanghai
    # 仅绑定宿主机回环地址，避免数据库直接暴露到公网
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-root123456}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis (缓存/限流/分布式锁/黑名单) ----------
  redis:
    image: redis:7-alpine
    container_name: bi-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- 后端 API ----------
  backend:
    build: ../bi-lowcode-server
    container_name: bi-backend
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root123456}@mysql:3306/bi_lowcode
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-bi-lowcode-dev-jwt-secret-change-me-in-production}
      # crypto.ts 要求 64 字符密钥，过短会导致数据源密码加解密直接抛错
      CRYPTO_KEY: ${CRYPTO_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 素材上传目录持久化，容器重建后图片/视频不丢失
      - uploads_data:/app/uploads
    # 启动前执行数据库迁移；种子数据不应在生产启动流程中重复执行
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------- 前端 Nginx ----------
  frontend:
    build: .
    container_name: bi-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  uploads_data:
