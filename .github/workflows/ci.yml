# ============================================================================
# BI 低代码平台 - CI 流水线
# ============================================================================
# 触发: PR 和 push 到 main/develop 分支
# 作业: 前端 lint+typecheck+build | 后端 lint+typecheck+test+build
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==================== 前端 ====================
  frontend:
    name: Frontend (vue3-bi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue3-bi

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vue3-bi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src/

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build

  # ==================== 后端 ====================
  backend:
    name: Backend (bi-lowcode-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bi-lowcode-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bi-lowcode-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
