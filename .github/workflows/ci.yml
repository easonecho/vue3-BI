# ============================================================================
# BI 低代码平台 - CI 流水线
# ============================================================================
# 触发: PR 和 push 到 main/develop 分支
# 作业: 前端 lint+typecheck+test+build+bundle 体积门槛
# 说明: 后端 bi-lowcode-server 是独立仓库, 由它自己的 CI 流水线负责
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==================== 前端 ====================
  frontend:
    name: Frontend (vue3-bi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue3-bi

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vue3-bi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm exec oxlint src/

      # 只跑 error 级规则：项目中仍有 284 处 no-explicit-any 等 warning，暂不作为门禁
      - name: Lint (eslint)
        run: pnpm exec eslint src/ --quiet

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      # 首屏体积门槛: 防止大依赖(如 monaco)再次被并入首屏预载
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs
