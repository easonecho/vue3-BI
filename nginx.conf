# ============================================================================
# BI 低代码平台 - 前端 Nginx 配置
# ============================================================================
# - 静态资源长缓存 + index.html no-cache, 保证发版后立即生效
# - /api 与 /uploads 反向代理到后端 (uploads 不再 404)
# - 安全响应头: nosniff / Referrer-Policy / Permissions-Policy / HSTS / CSP
# - CSP 的 frame-ancestors 按路径区分:
#     普通页面 'self' (防点击劫持)
#     /embed/ 允许第三方 iframe 嵌入 (公开看板嵌入功能)
#   使用 $request_uri 而不是 $uri, 避免 try_files 内部重定向丢失原始路径
# ============================================================================

map $request_uri $bi_frame_ancestors {
    default  "'self'";
    ~^/embed/ "*";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 素材上传最大 200MB（与后端 multer 限制保持一致）
    client_max_body_size 200m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 基础安全响应头 (CSP 见 security-headers.conf)
    include /etc/nginx/security-headers.conf;

    # 前端 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，避免发版后旧页面引用已删除的 hash chunk
    location = /index.html {
        # 注意: location 内一旦使用 add_header，server 级安全头不会自动继承，
        #       这里重新 include，保证入口文档安全头不丢失
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # API 代理到后端服务（^~ 防止被下面的静态资源正则拦截）
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BI 大查询/导出耗时较长，避免网关过早断开
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 素材静态文件由后端统一读取/加固（生产环境不再 404）
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
