server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 素材上传最大 200MB（与后端 multer 限制保持一致）
    client_max_body_size 200m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 基础安全响应头（CSP 需按实际内嵌/Worker 场景单独设计，避免误伤图表与 Monaco）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 前端 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，避免发版后旧页面引用已删除的 hash chunk
    location = /index.html {
        # 注意: location 内一旦使用 add_header，server 级安全头不会自动继承，
        #       这里重复声明，保证入口文档安全头不丢失
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # API 代理到后端服务（^~ 防止被下面的静态资源正则拦截）
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BI 大查询/导出耗时较长，避免网关过早断开
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 素材静态文件由后端统一鉴权/读取（生产环境不再 404）
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存（带 hash 的文件可长期缓存）
    # 本 location 不写 add_header，以继承 server 级安全响应头
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
    }
}
