# ============================================================================
# BI 低代码平台 - 共享安全响应头
# ============================================================================
# 由 nginx.conf 在 server / index.html / 静态资源 location 中 include。
# 注意: Nginx 的 add_header 不会跨 location 继承, 因此每个使用 add_header
#       的 location 都要显式 include 本文件。
#
# 未使用 X-Frame-Options: 平台支持 /embed/:token 第三方 iframe 嵌入,
# 统一由 CSP frame-ancestors 控制 (普通页面 'self', /embed/ 允许任意来源)。
# ============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob: https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $bi_frame_ancestors" always;
